<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mapa</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Mapa</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <iframe id="m" title="Mapa" style="width:100%;height:52vh;border:0;border-radius:20px;background:var(--soft)" loading="lazy"></iframe>
  <nav class="legtabs" id="chips" aria-label="Lugares"></nav>
  <input type="search" id="q" placeholder="Filtrar por nombre" aria-label="Filtrar por nombre" hidden>
  <a class="link" id="open" target="_blank">Abrir en Google Maps</a>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('planificar.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id); let items = [], cur = '', q = '';
  const show = n => { cur = n; $('m').src = 'https://www.google.com/maps?output=embed&q=' + encodeURIComponent(n); $('open').href = T.map(n); };
  const draw = () => { const v = items.filter(x => x[1].toLowerCase().includes(q));
    $('chips').innerHTML = v.length ? v.map(x => `<button class="chip ${x[1] === cur ? 'on' : ''}" data-q="${T.esc(x[1])}">${x[0]} ${T.esc(x[1])}</button>`).join('') : '<p class="muted">Sin resultados.</p>'; };
  A.requireUser().then(async u => { if (!u) return; const t = await T.get();
    items = [...(t.legs || []).map(l => ['🧭', l.country]), ...(t.places || []).map(p => ['📍', p.name]), ...(t.hotels || []).map(h => ['🏨', h.name])].filter(x => x[1]);
    if (!items.length) { $('chips').innerHTML = '<p class="muted">Añade destinos, sitios u hoteles para verlos aquí.</p>'; return; }
    $('q').hidden = false; show(items[0][1]); draw(); });
  $('chips').onclick = ev => { const b = ev.target.closest('[data-q]'); if (b) { show(b.dataset.q); draw(); } };
  $('q').oninput = ev => { q = ev.target.value.trim().toLowerCase(); draw(); };
</script></body></html>
