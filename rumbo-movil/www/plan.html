<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Plan</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Plan</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header><p class="muted" id="total"></p>
  <div class="two"><button class="btn ghost" id="ics">📅 Exportar calendario</button><button class="btn ghost" onclick="A.go('itinerario.html?id='+T.id())">🖨️ Itinerario PDF</button></div>
  <nav class="legtabs" id="tabs" aria-label="Destinos" hidden></nav>
  <section class="stack" id="agenda"></section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('planificar.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id), e = T.esc; let t, open = null, cur = 0;
  const range = (a, b) => { const r = []; let d = new Date(a + 'T00:00:00Z'); const z = new Date(b + 'T00:00:00Z');
    while (d <= z && r.length < 366) { r.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() + 864e5); } return r; };
  const fmt = d => new Date(d + 'T00:00:00Z').toLocaleDateString(A.loc, { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  const drawTabs = () => { const L = t.legs || []; $('tabs').hidden = L.length < 2;
    $('tabs').innerHTML = L.map((l, i) => `<button class="chip ${i === cur ? 'on' : ''}" data-t="${i}">${e(l.country || 'Destino ' + (i + 1))}</button>`).join(''); };
  const form = o => { const p = o.idx !== undefined ? t.plan[o.idx] : {};
    const refs = ['', ...t.places.map(x => x.name), ...t.hotels.map(x => x.name)];
    return `<div class="stack"><div class="two"><label>Hora<input type="time" name="time" value="${e(p.time)}"></label><label>Duración<input name="dur" placeholder="Ej.: 2 h" value="${e(p.dur)}"></label></div>
    <label>Actividad<textarea name="text" rows="2">${e(p.text)}</textarea></label>
    <div class="two"><label>Coste (€)<input type="number" name="cost" value="${e(p.cost)}"></label>
    <label>Sitio u hotel<select name="ref">${refs.map(r => `<option value="${e(r)}" ${r === p.ref ? 'selected' : ''}>${r ? e(r) : 'Ninguno'}</option>`).join('')}</select></label></div>
    <button class="btn wide" data-save>${o.idx !== undefined ? 'Guardar cambios' : 'Añadir al plan'}</button><button class="btn ghost wide" data-cancel>Cancelar</button></div>`; };
  const render = () => {
    const days = [], seen = new Set();
    (t.legs || []).forEach((l, li) => { if (l.start && l.end) range(l.start, l.end).forEach(d => { if (!seen.has(d)) { seen.add(d); days.push({ d, c: l.country, li }); } }); });
    const total = t.plan.reduce((s, p) => s + (+p.cost || 0), 0); $('total').textContent = total ? `Coste total de actividades: ${total} €` : '';
    drawTabs(); if (!days.length) { $('agenda').innerHTML = '<p class="muted">Pon fechas a tus destinos en el planificador y aquí aparecerá tu agenda día a día.</p>'; return; }
    const vis = days.filter(x => x.li === cur); let h = '';
    if (!vis.length) { $('agenda').innerHTML = '<p class="muted">Este destino aún no tiene fechas.</p>'; return; }
    vis.forEach(({ d }) => {
      const items = t.plan.map((p, i) => ({ ...p, i })).filter(p => p.day === d);
      const sum = items.reduce((s, p) => s + (+p.cost || 0), 0);
      h += `<section class="card day" data-day="${d}"><header><b>${fmt(d)}</b><span class="muted">${sum ? sum + ' €' : ''}</span><button class="add" data-add aria-label="Añadir plan">＋</button></header>`
        + items.map(p => open && open.idx === p.i ? form(open) : `<div class="entry" draggable="true" data-i="${p.i}"><time>${e(p.time) || '--:--'}</time><div class="grow" style="flex:1"><span>${e(p.text)}</span>
          <span class="muted">${[p.dur, p.cost ? p.cost + ' €' : ''].filter(Boolean).map(e).join(' · ')}</span>${p.ref ? `<a class="link" target="_blank" href="${T.map(p.ref)}">📌 ${e(p.ref)}</a>` : ''}</div>
          <button class="del" data-u="${p.i}" aria-label="Subir">▲</button><button class="del" data-d="${p.i}" aria-label="Bajar">▼</button><button class="del" data-e="${p.i}" aria-label="Editar">✏️</button><button class="del" data-x="${p.i}" aria-label="Eliminar">🗑️</button></div>`).join('')
        + (open && open.day === d && open.idx === undefined ? form(open) : '') + '</section>';
    });
    $('agenda').innerHTML = h;
  };
  A.requireUser().then(async u => { if (!u) return; t = await T.get(); t.places = t.places || []; t.hotels = t.hotels || []; render(); });
  const sortDay = d => { const ix = []; t.plan.forEach((p, i) => { if (p.day === d) ix.push(i); });
    const s = ix.map(i => t.plan[i]).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')); ix.forEach((i, k) => (t.plan[i] = s[k])); };
  const move = async (i, dir) => { const ix = []; t.plan.forEach((p, k) => { if (p.day === t.plan[i].day) ix.push(k); });
    const k = ix[ix.indexOf(i) + dir]; if (k === undefined) return; [t.plan[i], t.plan[k]] = [t.plan[k], t.plan[i]]; await T.save(t); render(); };
  let drag = null;
  $('agenda').ondragstart = ev => { const en = ev.target.closest('.entry'); drag = en ? +en.dataset.i : null; };
  $('agenda').ondragover = ev => { if (drag !== null) ev.preventDefault(); };
  $('agenda').ondrop = async ev => { ev.preventDefault(); const dc = ev.target.closest('.day'), en = ev.target.closest('.entry'); if (drag === null || !dc) { drag = null; return; }
    const item = t.plan.splice(drag, 1)[0]; item.day = dc.dataset.day; let at;
    if (en) { const ti = +en.dataset.i; at = ti === drag ? drag : ti > drag ? ti - 1 : ti; } else { let last = -1; t.plan.forEach((p, i) => { if (p.day === item.day) last = i; }); at = last + 1 || t.plan.length; }
    t.plan.splice(at, 0, item); drag = null; await T.save(t); render(); };
  const pad = n => String(n).padStart(2, '0'), ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const dur = s => { const m = String(s || '').toLowerCase(), h = m.match(/(\d+(?:[.,]\d+)?)\s*h/), mi = m.match(/(\d+)\s*m/); let x = 0; if (h) x += Math.round(parseFloat(h[1].replace(',', '.')) * 60); if (mi) x += +mi[1]; return x || 60; };
  const ics = s => String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  $('ics').onclick = () => { const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Rumbo//ES', 'CALSCALE:GREGORIAN'], st = new Date().toISOString().replace(/[-:]|\.\d+/g, '');
    const nd = s => { const x = new Date(s + 'T00:00:00'); x.setDate(x.getDate() + 1); return ymd(x); };
    t.plan.forEach((p, i) => { if (!p.day) return; L.push('BEGIN:VEVENT', `UID:${t._id}-p${i}@rumbo`, `DTSTAMP:${st}`);
      if (p.time) { const a = new Date(p.day + 'T' + p.time + ':00'), z = new Date(a.getTime() + dur(p.dur) * 60000); L.push(`DTSTART:${ymd(a)}T${pad(a.getHours())}${pad(a.getMinutes())}00`, `DTEND:${ymd(z)}T${pad(z.getHours())}${pad(z.getMinutes())}00`); }
      else L.push(`DTSTART;VALUE=DATE:${p.day.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${nd(p.day)}`);
      L.push(`SUMMARY:${ics(p.text)}`); if (p.ref) L.push(`LOCATION:${ics(p.ref)}`); if (p.cost) L.push(`DESCRIPTION:${ics('Coste: ' + p.cost + ' €')}`); L.push('END:VEVENT'); });
    (t.hotels || []).forEach((h, i) => { if (!h.checkin || !h.checkout) return; L.push('BEGIN:VEVENT', `UID:${t._id}-h${i}@rumbo`, `DTSTAMP:${st}`, `DTSTART;VALUE=DATE:${h.checkin.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${h.checkout.replace(/-/g, '')}`, `SUMMARY:${ics('🏨 ' + h.name)}`, 'END:VEVENT'); });
    L.push('END:VCALENDAR'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar' }));
    a.download = t.title.replace(/[^\w-]+/g, '_') + '.ics'; document.body.appendChild(a); a.click(); a.remove(); A.toast('Calendario descargado: ábrelo para importarlo'); };
  $('tabs').onclick = ev => { const b = ev.target.closest('[data-t]'); if (!b) return; cur = +b.dataset.t; open = null; render(); };
  $('agenda').onclick = async ev => {
    const b = ev.target.closest('button'); if (!b) return; const day = b.closest('.day')?.dataset.day;
    if (b.dataset.u !== undefined || b.dataset.d !== undefined) await move(+(b.dataset.u ?? b.dataset.d), b.dataset.u !== undefined ? -1 : 1);
    else if (b.hasAttribute('data-add')) { open = { day }; render(); }
    else if (b.dataset.e !== undefined) { open = { day, idx: +b.dataset.e }; render(); }
    else if (b.dataset.x !== undefined) { t.plan.splice(+b.dataset.x, 1); await T.save(t); render(); }
    else if (b.hasAttribute('data-cancel')) { open = null; render(); }
    else if (b.hasAttribute('data-save')) {
      const q = n => b.closest('.day').querySelector(`[name=${n}]`).value.trim();
      if (!q('text')) return A.toast('Describe la actividad');
      const p = { day: open.day, time: q('time'), text: q('text'), dur: q('dur'), cost: q('cost'), ref: q('ref') };
      open.idx !== undefined ? (t.plan[open.idx] = p) : t.plan.push(p);
      sortDay(p.day);
      await T.save(t); open = null; render();
    }
  };
</script></body></html>
