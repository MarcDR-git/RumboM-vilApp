<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Moneda</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Moneda</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <section class="card stack">
    <label>Cantidad<input type="number" id="amt" value="100"></label>
    <div class="two"><label>De<select id="from"></select></label><label>A<select id="to"></select></label></div>
    <button class="btn ghost wide" id="sw">⇄ Intercambiar</button>
    <h1 id="res">—</h1><p class="muted" id="rate"></p><div class="err" id="err"></div>
  </section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('planificar.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id), HOSTS = ['https://api.frankfurter.dev/v1', 'https://api.frankfurter.app'];
  async function get(path) { for (const h of HOSTS) { try { const r = await fetch(h + path); if (r.ok) return await r.json(); } catch {} } throw new Error('No se pudo consultar el cambio (¿sin conexión?)'); }
  async function conv() { const a = +$('amt').value, f = $('from').value, t = $('to').value; $('err').textContent = '';
    if (!a || f === t) { $('res').textContent = a ? a.toLocaleString(A.loc) + ' ' + t : '—'; $('rate').textContent = ''; return; }
    try { const d = await get(`/latest?amount=${a}&from=${f}&to=${t}&base=${f}&symbols=${t}`); const v = d.rates[t];
      $('res').textContent = v.toLocaleString(A.loc, { maximumFractionDigits: 2 }) + ' ' + t; $('rate').textContent = `Cambio del ${d.date}: 1 ${f} ≈ ${(v / a).toFixed(4)} ${t}`; }
    catch (x) { $('err').textContent = x.message; } }
  A.requireUser().then(async u => { if (!u) return;
    try { const cur = await get('/currencies'); const o = Object.entries(cur).map(([k, v]) => `<option value="${k}">${k} · ${v}</option>`).join('');
      $('from').innerHTML = $('to').innerHTML = o; $('from').value = localStorage.getItem('cf') || 'EUR'; $('to').value = localStorage.getItem('ct') || 'USD'; conv(); }
    catch (x) { $('err').textContent = x.message; } });
  ['amt', 'from', 'to'].forEach(i => $(i).oninput = () => { localStorage.setItem('cf', $('from').value); localStorage.setItem('ct', $('to').value); conv(); });
  $('sw').onclick = () => { const f = $('from').value; $('from').value = $('to').value; $('to').value = f; conv(); };
</script></body></html>
