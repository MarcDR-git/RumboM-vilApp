<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Itinerario</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Itinerario</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <style>@media print{.top,.foot,.noprint{display:none!important}.screen{max-width:none;padding:0}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}</style>
  <section id="doc" class="stack"></section>
  <footer class="foot"><button class="btn wide noprint" onclick="window.print()">Imprimir / Guardar como PDF</button>
    <button class="btn ghost wide noprint" onclick="A.go('plan.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id), e = T.esc, n = x => +x || 0;
  const range = (a, b) => { const r = []; let d = new Date(a + 'T00:00:00Z'); const z = new Date(b + 'T00:00:00Z'); while (d <= z && r.length < 366) { r.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() + 864e5); } return r; };
  const fmt = d => new Date(d + 'T00:00:00Z').toLocaleDateString(A.loc, { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  A.requireUser().then(async u => { if (!u) return; const t = await T.get(); const legs = t.legs || [], plan = t.plan || [], hotels = t.hotels || [];
    const seen = new Set(), days = []; legs.forEach(l => { if (l.start && l.end) range(l.start, l.end).forEach(d => { if (!seen.has(d)) { seen.add(d); days.push({ d, c: l.country }); } }); });
    const total = legs.reduce((s, l) => s + n(l.flight?.price), 0) + n(t.flights?.back?.price) + hotels.reduce((s, h) => s + n(h.price), 0) + plan.reduce((s, p) => s + n(p.cost), 0) + (t.expenses || []).reduce((s, x) => s + n(x.amount), 0);
    let h = `<h1>${e(t.title)}</h1><p class="muted">${e(legs.map(l => l.country).filter(Boolean).join(' → '))}${t.start ? ' · ' + e(t.start) + ' → ' + e(t.end) : ''}</p>`;
    const fl = [...legs.filter(l => l.flight?.name).map(l => `✈️ ${e(l.country)}: ${e(l.flight.name)} ${l.flight.price ? '(' + e(l.flight.price) + ' €)' : ''}`), t.flights?.back?.name ? `✈️ Vuelta: ${e(t.flights.back.name)} ${t.flights.back.price ? '(' + e(t.flights.back.price) + ' €)' : ''}` : ''].filter(Boolean);
    if (fl.length) h += `<div class="card stack"><b>Vuelos</b>${fl.map(x => `<span>${x}</span>`).join('')}</div>`;
    if (hotels.length) h += `<div class="card stack"><b>Hoteles</b>${hotels.map(x => `<span>🏨 ${e(x.name)} · ${e(x.checkin)} → ${e(x.checkout)}${x.price ? ' · ' + e(x.price) + ' €' : ''}</span>`).join('')}</div>`;
    h += days.map(({ d, c }) => { const it = plan.filter(p => p.day === d); return `<div class="card stack"><b style="text-transform:capitalize">${fmt(d)} <span class="muted">· ${e(c)}</span></b>` +
      (it.length ? it.map(p => `<span><b>${e(p.time) || '--:--'}</b> ${e(p.text)} <span class="muted">${[p.dur, p.cost ? p.cost + ' €' : '', p.ref].filter(Boolean).map(e).join(' · ')}</span></span>`).join('') : '<span class="muted">Sin actividades</span>') + '</div>'; }).join('');
    h += `<p><b>Coste total estimado: ${total.toLocaleString(A.loc)} €</b></p>`; $('doc').innerHTML = h; });
</script></body></html>
