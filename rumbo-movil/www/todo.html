<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>To-Do</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1 id="h" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <button class="btn wide" id="new">＋ Añadir elemento</button>
  <section class="card stack" id="form">
    <label>Nombre del elemento<input id="f_name" maxlength="120"></label>
    <label>Descripción<textarea id="f_desc" rows="2"></textarea></label>
    <label>Enlace rápido (https://…)<input id="f_link" type="url" inputmode="url"></label>
    <label>Coste (€)<input id="f_cost" type="number" min="0" step="any"></label>
    <label>Imagen (opcional)<input id="f_img" type="file" accept="image/*"></label>
    <label>Imagen por enlace (https://…)<input id="f_imgurl" type="url" inputmode="url"></label>
    <button class="btn wide" id="add">Añadir elemento</button><button class="btn ghost wide" id="cancel">Cancelar</button>
  </section>
  <div id="ctl" class="stack">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap"><span class="muted" id="s1"></span><span class="muted" id="s2"></span></div>
    <div class="two"><button class="btn ghost" id="bf"></button><button class="btn ghost" id="bo"></button></div>
  </div>
  <section class="stack" id="items"></section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('todolist.html')">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id), e = T.esc, id = T.id(); let list, edit = null, open = false, flt = 'all', ord = 'az';
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const norm = u => { u = (u || '').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; try { new URL(u); return u; } catch { return ''; } };
  const fill = it => { $('f_name').value = it?.name || ''; $('f_desc').value = it?.desc || ''; $('f_link').value = it?.link || ''; $('f_cost').value = it?.cost ?? ''; $('f_img').value = ''; $('f_imgurl').value = it?.image?.startsWith('http') ? it.image : ''; };
  const view = () => { const empty = !list.items.length; $('form').hidden = !(open || empty); $('new').hidden = open || empty; $('ctl').hidden = empty;
    $('cancel').hidden = empty && !edit; $('add').textContent = edit ? 'Guardar cambios' : 'Añadir elemento'; };
  const render = () => {
    $('h').textContent = list.title; document.title = list.title;
    let it = list.items.filter(x => flt === 'all' || (flt === 'done') === x.done);
    if (ord) it = [...it].sort((a, b) => a.name.localeCompare(b.name, A.loc) * (ord === 'az' ? 1 : -1));
    const FL = { all: ['◐', 'Todos'], pending: ['⏳', 'Pendientes'], done: ['✅', 'Hechos'] };
    $('bf').innerHTML = `<span aria-hidden="true">${FL[flt][0]}</span> ${FL[flt][1]}`;
    $('bo').innerHTML = `<span aria-hidden="true">${ord === 'az' ? '⬇' : '⬆'}</span> ${ord === 'az' ? 'A → Z' : 'Z → A'}`;
    const n = list.items.length, d = list.items.filter(x => x.done).length, pend = list.items.filter(x => !x.done).reduce((s, x) => s + (+x.cost || 0), 0);
    $('s1').textContent = `${d} de ${n} hechos`; $('s2').textContent = pend ? `Pendiente: ${pend.toLocaleString(A.loc)} €` : '';
    $('items').innerHTML = it.map(x => `<div class="card item ${x.done ? 'todo-done' : ''}" style="align-items:center">
      <input type="checkbox" style="width:24px;height:24px;flex:none" data-t="${x.id}" ${x.done ? 'checked' : ''} aria-label="Hecho">
      <div class="thumb" style="width:64px;height:64px;background-image:url('${e(x.image)}')">${x.image ? '' : '🎯'}</div>
      <div class="grow"><b style="${x.done ? 'text-decoration:line-through;opacity:.55' : ''}">${e(x.name)}</b>${x.desc ? `<span class="muted">${e(x.desc)}</span>` : ''}
        ${x.cost !== '' && x.cost != null ? `<span>${Number(x.cost).toLocaleString(A.loc)} €</span>` : ''}
        ${x.link ? `<a class="link" target="_blank" rel="noopener" href="${e(x.link)}">🔗 Abrir enlace</a>` : ''}</div>
      <div><button class="del" data-e="${x.id}" aria-label="Editar">✏️</button><button class="del" data-x="${x.id}" aria-label="Eliminar">🗑️</button></div></div>`).join('')
      || (n ? '<p class="muted">Sin resultados.</p>' : '');
    view(); };
  const save = async () => { list = await A.api('/api/list/' + id, 'PUT', { items: list.items }); render(); };
  A.requireUser().then(async u => { if (!u) return; try { list = await A.api('/api/list/' + id); fill(); render(); } catch { A.go('todolist.html'); } });
  $('new').onclick = () => { edit = null; open = true; fill(); view(); $('f_name').focus(); };
  $('cancel').onclick = () => { edit = null; open = false; fill(); view(); };
  $('bf').onclick = () => { flt = { all: 'pending', pending: 'done', done: 'all' }[flt]; render(); };
  $('bo').onclick = () => { ord = ord === 'az' ? 'za' : 'az'; render(); };
  $('add').onclick = async () => { const name = $('f_name').value.trim(); if (!name) return A.toast('Escribe un nombre');
    const raw = $('f_link').value.trim(), link = raw ? norm(raw) : ''; if (raw && !link) return A.toast('Enlace no válido');
    const old = edit ? list.items.find(x => x.id === edit) : null, file = $('f_img').files[0], urlRaw = $('f_imgurl').value.trim(); let image = old?.image || '';
    if (file) image = await A.photo(file);
    else if (urlRaw) { if (!/^https?:\/\/[^\s'"()<>]{1,500}$/i.test(urlRaw)) return A.toast('Enlace de imagen no válido');
      if (!(await new Promise(ok => { const i = new Image(); i.onload = () => ok(true); i.onerror = () => ok(false); i.src = urlRaw; setTimeout(() => ok(false), 7000); }))) return A.toast('No se pudo cargar esa imagen');
      image = urlRaw; }
    else if (image.startsWith('http')) image = '';
    const it = { id: old ? old.id : newId(), name, desc: $('f_desc').value.trim(), link, cost: $('f_cost').value === '' ? '' : +$('f_cost').value,
      image, done: old?.done || false };
    old ? (list.items[list.items.indexOf(old)] = it) : list.items.push(it); edit = null; open = false; fill(); await save(); };
  $('items').onclick = async ev => { const t = ev.target.dataset.t, b = ev.target.closest('button');
    if (t) { list.items.find(x => x.id === t).done = ev.target.checked; await save(); }
    else if (b && b.dataset.e) { const x = list.items.find(i => i.id === b.dataset.e); edit = x.id; open = true; fill(x); view(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (b && b.dataset.x) { list.items = list.items.filter(i => i.id !== b.dataset.x); await save(); } };
</script></body></html>
