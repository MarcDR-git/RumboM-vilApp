<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Planificar</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h2 id="title"></h2><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <div style="display:flex;justify-content:center" id="g"></div>
  <section id="legs"></section>
  <nav class="legtabs" id="tabs" aria-label="Destinos"></nav>
  <nav class="two" style="grid-template-columns:repeat(3,1fr)">
    <button class="btn ghost" onclick="nav('presupuesto')">💶 Presupuesto</button><button class="btn ghost" onclick="nav('mapa')">🗺️ Mapa</button><button class="btn ghost" onclick="nav('lista')">🎒 Qué llevar</button><button class="btn ghost" onclick="nav('tiempo')">🌤️ Tiempo</button><button class="btn ghost" onclick="nav('moneda')">💱 Moneda</button><button class="btn ghost" onclick="nav('documentos')">📄 Documentos</button>
  </nav>
  <section class="card stack"><b>Vuelo de vuelta</b>
    <div class="two"><input type="text" id="fl_back" placeholder="Avión"><input type="number" id="pr_back" placeholder="Precio €"></div>
    <button class="btn ghost wide" id="fl">Buscar vuelos</button></section>
  <footer class="foot">
    <nav class="two" style="grid-template-columns:repeat(3,1fr)">
      <button class="btn" onclick="nav('sitios')">Sitios</button><button class="btn" onclick="nav('hoteles')">Hoteles</button><button class="btn" onclick="nav('plan')">Plan</button>
    </nav>
    <button class="btn ghost wide" onclick="A.go('home.html')">Volver atrás</button>
  </footer>
</main>
<script>
  const $ = id => document.getElementById(id); let t, cur = 0;
  $('g').innerHTML = A.globe();
  const nd = l => { const n = l.start && l.end ? Math.round((new Date(l.end) - new Date(l.start)) / 864e5) + 1 : 0; return n > 0 ? `${n} día${n > 1 ? 's' : ''}` : ''; };
  const sync = () => { const L = t.legs, ds = k => L.map(l => l[k]).filter(Boolean).sort();
    t.country = L[0].country; t.destinos = L.slice(1).map(l => l.country).filter(Boolean);
    t.start = ds('start')[0] || ''; t.end = ds('end').pop() || ''; t.flights.out = L[0].flight; };
  const save = async () => { sync(); await T.save(t); };
  async function nav(p) { t.flights.back = { name: $('fl_back').value, price: $('pr_back').value }; await save(); A.go(p + '.html?id=' + t._id); }
  const tabs = () => $('tabs').innerHTML = t.legs.map((l, i) => `<button class="chip ${i === cur ? 'on' : ''}" data-t="${i}">${T.esc(l.country || 'Destino ' + (i + 1))}</button>`).join('')
    + '<button class="chip" data-new aria-label="Añadir destino">＋</button>';
  const draw = () => { const l = t.legs[cur];
    $('legs').innerHTML = `<section class="card stack" data-i="${cur}">
    <div class="row"><input data-k="country" placeholder="País de destino" value="${T.esc(l.country)}">${t.legs.length > 1 ? '<button class="del" data-del aria-label="Quitar destino">🗑️</button>' : ''}</div>
    <div class="two"><label>Desde<input type="date" data-k="start" value="${l.start || ''}"></label><label>Hasta<input type="date" data-k="end" value="${l.end || ''}"></label></div>
    <p class="muted days">${nd(l)}</p>
    <div class="two"><input data-k="name" placeholder="Avión de ida" value="${T.esc(l.flight.name)}"><input type="number" data-k="price" placeholder="Precio €" value="${T.esc(l.flight.price)}"></div></section>`;
    tabs(); };
  A.requireUser().then(async u => { if (!u) return; t = await T.get(); t.flights = t.flights || { out: {}, back: {} };
    if (!t.legs) { t.legs = [{ country: t.country || '', start: t.start || '', end: t.end || '', flight: t.flights.out || {} }];
      (t.destinos || []).forEach(c => t.legs.push({ country: c, start: '', end: '', flight: {} })); }
    t.legs.forEach(l => l.flight = l.flight || {});
    $('title').textContent = t.title; $('fl_back').value = t.flights.back.name || ''; $('pr_back').value = t.flights.back.price || '';
    draw(); $('fl_back').onchange = $('pr_back').onchange = () => { t.flights.back = { name: $('fl_back').value, price: $('pr_back').value }; save(); }; });
  $('legs').onchange = e => { const c = e.target.closest('[data-i]'), k = e.target.dataset.k; if (!c || !k) return;
    const l = t.legs[cur]; if (k === 'name' || k === 'price') l.flight[k] = e.target.value; else l[k] = e.target.value;
    c.querySelector('.days').textContent = nd(l); tabs(); save(); };
  $('legs').onclick = async e => { if (!e.target.closest('[data-del]')) return; t.legs.splice(cur, 1); cur = Math.max(0, cur - 1); draw(); await save(); };
  $('tabs').onclick = async e => { const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-new')) { const p = t.legs[t.legs.length - 1]; t.legs.push({ country: '', start: p.end || '', end: '', flight: {} }); cur = t.legs.length - 1; draw(); await save(); }
    else { cur = +b.dataset.t; draw(); } };
  $('fl').onclick = () => window.open('https://www.google.com/travel/flights?q=' + encodeURIComponent(`Vuelos a ${t.legs[cur].country || t.country} ${t.legs[cur].start} ${t.legs[cur].end}`), '_blank');
</script></body></html>
