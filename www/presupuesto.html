<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Presupuesto</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Presupuesto</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <div class="card"><p class="muted">Total estimado</p><h1 id="total"></h1></div>
  <section class="card stack" id="cats"></section>
  <section class="card stack">
    <b>Otros gastos</b>
    <div class="two"><input id="c" placeholder="Concepto (comida, transporte…)"><input id="a" type="number" placeholder="Importe €"></div>
    <button class="btn wide" id="add">Añadir gasto</button>
    <div id="ex"></div>
  </section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('planificar.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id), n = x => +x || 0, e = T.esc; let t;
  const render = () => {
    const fl = (t.legs || [{ flight: t.flights?.out }]).reduce((s, l) => s + n(l.flight?.price), 0) + n(t.flights?.back?.price);
    const c = [['✈️ Vuelos', fl], ['🏨 Hoteles', t.hotels.reduce((s, h) => s + n(h.price), 0)],
      ['🗓️ Actividades', t.plan.reduce((s, p) => s + n(p.cost), 0)], ['🧾 Otros', t.expenses.reduce((s, x) => s + n(x.amount), 0)]];
    const tot = c.reduce((s, x) => s + x[1], 0); $('total').textContent = tot.toLocaleString(A.loc) + ' €';
    $('cats').innerHTML = c.map(([l, v]) => `<div><div class="row" style="justify-content:space-between"><span>${l}</span><b>${v.toLocaleString(A.loc)} €</b></div>
      <div class="bar" style="width:100%;margin-top:6px"><i style="width:${tot ? v / tot * 100 : 0}%;animation:none"></i></div></div>`).join('');
    $('ex').innerHTML = t.expenses.map((x, i) => `<div class="entry"><div style="flex:1">${e(x.name)}</div><b>${e(x.amount)} €</b><button class="del" data-i="${i}" aria-label="Eliminar">🗑️</button></div>`).join('');
  };
  A.requireUser().then(async u => { if (!u) return; t = await T.get(); ['hotels', 'plan', 'expenses'].forEach(k => t[k] = t[k] || []); render(); });
  $('add').onclick = async () => { const name = $('c').value.trim(); if (!name || !n($('a').value)) return A.toast('Pon concepto e importe');
    t.expenses.push({ name, amount: n($('a').value) }); await T.save(t); $('c').value = $('a').value = ''; render(); };
  $('ex').onclick = async ev => { const b = ev.target.closest('[data-i]'); if (!b) return; t.expenses.splice(+b.dataset.i, 1); await T.save(t); render(); };
</script></body></html>
