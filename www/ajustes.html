<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ajustes</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Ajustes</h1></header>
  <div class="tabs"><button id="t1" class="on">General</button><button id="t2">Perfil</button></div>
  <section class="card" id="p1" style="display:flex;flex-direction:column;gap:14px">
    <button class="btn wide" id="th"></button>
    <label>Idioma<select id="lang"><option value="es">Español</option><option value="en">English</option></select></label>
    <button class="btn ghost wide" id="rc">Generar nuevo código de recuperación</button>
    <p class="muted" id="rcv" style="user-select:all;font-weight:700"></p>
    <button class="btn ghost wide" id="out">Cerrar sesión</button>
  </section>
  <section class="card" id="p2" style="display:none;flex-direction:column;gap:14px">
    <div class="row"><div id="prev"></div><label style="flex:1">Foto<input type="file" id="f" accept="image/*"></label></div>
    <label>Nombre de usuario<input type="text" id="u"></label>
    <div><b>Color del marco</b><div class="swatches" id="sw"></div></div>
    <div class="err" id="e" role="alert"></div>
    <button class="btn wide" id="save">Guardar cambios</button>
  </section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('home.html')">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  let user;
  const draw = () => $('prev').innerHTML = A.avatar({ username: $('u').value || '?', color: user.color, photo: user.photo }, 'sm');
  const label = () => $('th').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️ Cambiar a modo claro' : '🌙 Cambiar a modo oscuro';
  const tab = n => { [1, 2].forEach(i => { $('t' + i).classList.toggle('on', i === n); $('p' + i).style.display = i === n ? 'flex' : 'none'; }); };
  $('t1').onclick = () => tab(1); $('t2').onclick = () => tab(2);
  A.requireUser().then(u => { if (!u) return; user = u; $('u').value = u.username; label(); draw();
    $('sw').innerHTML = A.colors.map(c => `<button type="button" style="background:${c}" data-c="${c}" class="${c === u.color ? 'on' : ''}" aria-label="Color ${c}"></button>`).join(''); });
  $('sw').onclick = e => { const c = e.target.dataset.c; if (!c) return; user.color = c;
    [...$('sw').children].forEach(b => b.classList.toggle('on', b.dataset.c === c)); draw(); };
  $('u').oninput = draw;
  $('f').onchange = async e => { if (e.target.files[0]) { user.photo = await A.photo(e.target.files[0]); draw(); } };
  $('th').onclick = async () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    A.theme(t); label(); await A.api('/api/user/' + user._id, 'PUT', { theme: t }); };
  $('out').onclick = () => A.logout();
  $('lang').value = A.lang; $('lang').onchange = e => { localStorage.setItem('lang', e.target.value); location.reload(); };
  $('rc').onclick = async () => { try { $('rcv').textContent = (await A.api('/api/recovery-code', 'POST')).recoveryCode; } catch (x) { A.toast(x.message); } };
  $('save').onclick = async () => { try {
    user = await A.api('/api/user/' + user._id, 'PUT', { username: $('u').value, color: user.color, photo: user.photo });
    A.toast('Cambios guardados'); } catch (e) { $('e').textContent = e.message; } };
</script></body></html>
