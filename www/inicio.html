<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bienvenido a Rumbo</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head>
<body><main class="screen">
  <div style="margin-top:20px"><h1>Bienvenido a Rumbo</h1>
  <p class="muted">Planifica cada viaje en un solo lugar. Entra o crea tu cuenta para empezar.</p></div>
  <div class="tabs"><button id="tl" class="on">Iniciar sesión</button><button id="tr">Registrarme</button></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <label>Nombre de usuario<input type="text" id="u" autocomplete="username"></label>
    <label>Contraseña<input type="password" id="p" autocomplete="current-password"></label>
    <div id="reg" hidden style="display:none;flex-direction:column;gap:14px">
      <div><b>Color del marco</b><div class="swatches" id="sw"></div></div>
      <div class="row"><div id="prev"></div><label style="flex:1">Foto (opcional)<input type="file" id="f" accept="image/*"></label></div>
    </div>
    <div class="err" id="e" role="alert"></div>
    <button class="btn wide" id="go">Iniciar sesión</button>
  </div>
  <a class="link" href="recuperar.html" style="text-align:center">¿Olvidaste tu contraseña?</a>
</main>
<div class="sheet" id="rc" role="dialog"><h2>Código de recuperación</h2>
  <p class="muted">Guárdalo: es la única forma de recuperar tu contraseña si la olvidas. No se volverá a mostrar.</p>
  <h1 id="code" style="letter-spacing:.08em;user-select:all"></h1><button class="btn wide" onclick="A.go('home.html')">Lo he guardado</button></div>
<script>
  let mode = 'login', color = A.colors[0], photo = '';
  const $ = id => document.getElementById(id);
  const draw = () => $('prev').innerHTML = A.avatar({ username: $('u').value || '?', color, photo }, 'sm');
  $('sw').innerHTML = A.colors.map(c => `<button type="button" style="background:${c}" data-c="${c}" aria-label="Color ${c}"></button>`).join('');
  $('sw').onclick = e => { const c = e.target.dataset.c; if (!c) return; color = c;
    [...$('sw').children].forEach(b => b.classList.toggle('on', b.dataset.c === c)); draw(); };
  $('sw').children[0].classList.add('on');
  $('u').oninput = draw;
  $('f').onchange = async e => { if (e.target.files[0]) { photo = await A.photo(e.target.files[0]); draw(); } };
  function set(m) { mode = m; $('tl').classList.toggle('on', m === 'login'); $('tr').classList.toggle('on', m === 'reg');
    $('reg').style.display = m === 'reg' ? 'flex' : 'none';
    $('go').textContent = m === 'reg' ? 'Crear cuenta' : 'Iniciar sesión'; $('e').textContent = ''; draw(); }
  $('tl').onclick = () => set('login'); $('tr').onclick = () => set('reg');
  $('go').onclick = async () => {
    try {
      const body = { username: $('u').value, password: $('p').value, color, photo };
      const u = await A.api(mode === 'reg' ? '/api/register' : '/api/login', 'POST', body);
      localStorage.setItem('uid', u._id); localStorage.setItem('token', u.token);
      if (u.recoveryCode) { $('code').textContent = u.recoveryCode; $('rc').classList.add('open'); } else A.go('home.html');
    } catch (e) { $('e').textContent = e.message; }
  };
  set('login');
</script></body></html>
