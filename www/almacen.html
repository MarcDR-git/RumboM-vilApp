<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Almacén de planes</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Almacén de planes</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <section class="stack" id="list"></section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('home.html')">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  const render = async () => { const ts = await A.api('/api/trips/' + A.uid());
    $('list').innerHTML = ts.length ? ts.map(t => `<div class="card item" style="cursor:pointer;align-items:center" data-id="${t._id}">
      ${A.globe().replace('class="globe"', 'class="globe mini"')}<div class="grow"><b>${T.esc(t.title)}</b><span class="muted">${T.esc([t.country, ...(t.destinos || [])].filter(Boolean).join(', '))}</span></div>
      <button class="del" data-dup="${t._id}" aria-label="Duplicar" title="Duplicar">⧉</button></div>`).join('') : '<p class="muted">Todavía no tienes viajes. Crea el primero desde el menú.</p>'; };
  A.requireUser().then(u => { if (u) render(); });
  $('list').onclick = async e => { const d = e.target.closest('[data-dup]');
    if (d) { await A.api('/api/trip/' + d.dataset.dup + '/duplicate', 'POST', {}); A.toast('Viaje duplicado'); return render(); }
    const c = e.target.closest('[data-id]'); if (c) A.go('planificar.html?id=' + c.dataset.id); };
</script></body></html>
