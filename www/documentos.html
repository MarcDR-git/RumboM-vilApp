<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Documentos</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Documentos</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <section class="card stack"><p class="muted">Sube billetes, reservas y otros PDF o imágenes (máx. 10 MB cada uno).</p>
    <input type="file" id="f" accept="application/pdf,image/*"><div class="err" id="err" role="alert"></div>
    <button class="btn wide" id="up">Subir documento</button></section>
  <section class="stack" id="list"></section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('planificar.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id), e = T.esc, id = T.id();
  const size = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  const render = async () => { const l = await A.api('/api/docs/' + id);
    $('list').innerHTML = l.length ? l.map(d => `<div class="card item" style="align-items:center"><span style="font-size:1.6rem">${d.type === 'application/pdf' ? '📄' : '🖼️'}</span>
      <div class="grow"><b>${e(d.name)}</b><span class="muted">${size(d.size)} · ${new Date(d.createdAt).toLocaleDateString(A.loc)}</span></div>
      <button class="del" data-d="${d._id}" data-n="${e(d.name)}" aria-label="Descargar">⬇️</button><button class="del" data-x="${d._id}" aria-label="Eliminar">🗑️</button></div>`).join('') : '<p class="muted">Aún no hay documentos.</p>'; };
  A.requireUser().then(u => { if (u) render(); });
  $('up').onclick = async () => { const f = $('f').files[0]; $('err').textContent = ''; if (!f) return A.toast('Elige un archivo');
    if (f.size > 10485760) { $('err').textContent = 'Máximo 10 MB por archivo'; return; }
    const data = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(f); });
    try { await A.api('/api/docs', 'POST', { tripId: id, name: f.name, type: f.type, data }); $('f').value = ''; A.toast('Documento subido'); render(); }
    catch (x) { $('err').textContent = x.message; } };
  $('list').onclick = async ev => { const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.x) { await A.api('/api/doc/' + b.dataset.x, 'DELETE'); render(); }
    else if (b.dataset.d) { const r = { blob: () => LocalAPI.docBlob(b.dataset.d) };
      const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = b.dataset.n; document.body.appendChild(a); a.click(); a.remove(); } };
</script></body></html>
