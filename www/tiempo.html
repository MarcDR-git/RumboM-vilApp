<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tiempo previsto</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script></head>
<body><main class="screen">
  <header class="top"><h1>Tiempo previsto</h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <p class="muted" id="note">Previsión por destino y fechas (Open-Meteo).</p>
  <section class="stack" id="w"></section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('planificar.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
  const $ = id => document.getElementById(id), e = T.esc;
  const ico = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 57 ? '🌦️' : c <= 67 ? '🌧️' : c <= 77 ? '❄️' : c <= 82 ? '🌧️' : c <= 86 ? '🌨️' : '⛈️';
  const today = new Date().toISOString().slice(0, 10), max = new Date(Date.now() + 15 * 864e5).toISOString().slice(0, 10);
  const shift = (d, k) => d.replace(/^\d{4}/, y => +y + k);
  async function load(l) {
    const g = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name=' + encodeURIComponent(l.country))).json();
    const p = g.results?.[0]; if (!p) return { err: `No encuentro «${l.country}». Prueba con el nombre de una ciudad.` };
    const fc = l.start >= today && l.end <= max, s = fc ? l.start : shift(l.start, -1), z = fc ? l.end : shift(l.end, -1);
    const q = `?latitude=${p.latitude}&longitude=${p.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date=${s}&end_date=${z}`;
    const d = (await (await fetch((fc ? 'https://api.open-meteo.com/v1/forecast' : 'https://archive-api.open-meteo.com/v1/archive') + q)).json()).daily;
    if (!d) return { err: 'Sin datos para esas fechas.' };
    return { place: p.name + (p.country ? ', ' + p.country : ''), fc, days: d.time.map((x, i) => ({ x: fc ? x : shift(x, 1), c: d.weather_code[i], hi: d.temperature_2m_max[i], lo: d.temperature_2m_min[i], r: d.precipitation_sum[i] })) };
  }
  A.requireUser().then(async u => { if (!u) return; const t = await T.get(); const legs = (t.legs || []).filter(l => l.country);
    if (!legs.length) { $('w').innerHTML = '<p class="muted">Añade un destino en el planificador.</p>'; return; }
    $('w').innerHTML = legs.map((l, i) => `<section class="card stack" id="l${i}"><b>🧭 ${e(l.country)}</b><p class="muted">Cargando…</p></section>`).join('');
    legs.forEach(async (l, i) => { const box = $('l' + i);
      if (!l.start || !l.end) { box.innerHTML = `<b>🧭 ${e(l.country)}</b><p class="muted">Añade fechas a este destino.</p>`; return; }
      try { const r = await load(l);
        if (r.err) { box.innerHTML = `<b>🧭 ${e(l.country)}</b><p class="muted">${e(r.err)}</p>`; return; }
        box.innerHTML = `<b>🧭 ${e(l.country)}</b><p class="muted">${e(r.place)} · ${r.fc ? 'Previsión' : 'Aún no hay previsión (máx. 16 días): así fue el tiempo en esas fechas el año pasado'}</p>
          <div class="legtabs">${r.days.map(d => `<div class="card" style="flex:none;min-width:84px;text-align:center;padding:10px"><div class="muted">${new Date(d.x + 'T00:00:00').toLocaleDateString(A.loc, { day: 'numeric', month: 'short' })}</div><div style="font-size:1.6rem">${ico(d.c)}</div><b>${Math.round(d.hi)}°</b> <span class="muted">${Math.round(d.lo)}°</span><div class="muted">💧${d.r ?? 0} mm</div></div>`).join('')}</div>`;
      } catch { box.innerHTML = `<b>🧭 ${e(l.country)}</b><p class="muted">No se pudo cargar el tiempo (¿sin conexión?).</p>`; } }); });
</script></body></html>
