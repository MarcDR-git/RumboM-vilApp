<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>sitios</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script><script src="js/trip.js"></script><script src="js/lists.js"></script></head>
<body><main class="screen">
  <header class="top"><h1 id="h"></h1><button class="gear" onclick="A.go('ajustes.html')" aria-label="Ajustes">⚙️</button></header>
  <section class="card stack" id="form"></section>
  <section class="stack" id="list"></section>
  <footer class="foot"><button class="btn ghost wide" onclick="A.go('planificar.html?id='+T.id())">Volver atrás</button></footer>
</main>
<script>
Lists.init({ key: 'places', title: 'Sitios de interés', filter: true, icon: '📍', empty: 'Aún no has añadido sitios. Escribe el nombre de uno y pulsa Añadir.', img: true,
  fields: [{ k: 'name', label: 'Nombre del sitio' }, { k: 'desc', label: 'Descripción breve', type: 'textarea' }, { k: 'location', label: 'Lugar (ciudad o dirección)' }],
  line: (i) => `<span class="muted">${T.esc(i.desc)}</span>` });
